<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <img src="/logo.svg" alt="">
      <h1>My To-Do List</h1>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs doing?" aria-label="New task" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
    <p id="empty" class="empty">No tasks yet. Add your first one above.</p>
  </main>

  <script src="/script.js"></script>
</body>
</html>
